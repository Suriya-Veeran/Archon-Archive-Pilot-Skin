<div class="flex min-h-dvh flex-col items-center justify-center gap-4 p-4 text-center">
  @if (error()) {
    <p class="text-sm text-destructive">{{ error() }}</p>
    <a hlmBtn variant="outline" routerLink="/login">Back to sign in</a>
  } @else {
    <hlm-spinner class="size-6" />
    <p class="text-sm text-muted-foreground">Completing single sign-on…</p>
  }
</div>
