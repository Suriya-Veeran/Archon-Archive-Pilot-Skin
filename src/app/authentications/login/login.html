<div class="flex min-h-dvh items-center justify-center bg-muted/40 p-4">
  <div class="w-full max-w-sm">
    <archon-card title="Sign in to Archon">
      <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <archon-input label="Username" formControlName="username" />
        <archon-input label="Password" type="password" formControlName="password" />
        <button hlmBtn type="submit" class="w-full">Sign in</button>
      </form>
    </archon-card>
  </div>
</div>
