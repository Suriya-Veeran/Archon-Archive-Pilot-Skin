<ol class="mb-6 flex flex-wrap gap-2" aria-label="Steps">
  @for (step of steps(); track step.key; let i = $index) {
    <li class="flex min-w-0 flex-1 items-center gap-2">
      <button
        type="button"
        class="flex min-w-0 items-center gap-2 rounded-md px-2 py-1 text-left text-sm"
        [class.font-medium]="i === active()"
        [attr.aria-current]="i === active() ? 'step' : null"
        (click)="go(i)"
      >
        <span
          class="flex size-6 shrink-0 items-center justify-center rounded-full border text-xs"
          [class]="
            i < active()
              ? 'border-primary bg-primary text-primary-foreground'
              : i === active()
                ? 'border-primary'
                : ''
          "
        >
          @if (i < active()) {
            <ng-icon name="lucideCheck" class="size-3.5" />
          } @else {
            {{ i + 1 }}
          }
        </span>
        <span class="truncate">{{ step.label }}</span>
      </button>
      @if (i < steps().length - 1) {
        <span class="hidden h-px flex-1 bg-border sm:block"></span>
      }
    </li>
  }
</ol>

<div class="min-h-40"><ng-content /></div>

<div class="mt-6 flex justify-between border-t pt-4">
  <button
    hlmBtn
    variant="outline"
    type="button"
    [disabled]="active() === 0"
    (click)="active.set(active() - 1)"
  >
    {{ text.backText }}
  </button>
  <button hlmBtn type="button" [disabled]="nextDisabled()" (click)="next()">
    {{ isLast() ? text.finishText : text.nextText }}
  </button>
</div>
