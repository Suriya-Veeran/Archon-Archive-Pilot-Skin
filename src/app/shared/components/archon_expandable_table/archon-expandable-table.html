<div hlmTableContainer class="rounded-md border">
  <table hlmTable>
    <thead hlmTHead>
      <tr hlmTr>
        <th hlmTh class="w-10"><span class="sr-only">Expand</span></th>
        @for (col of columns(); track col.key) {
          <th hlmTh [class]="col.align === 'right' ? 'text-right' : ''">{{ col.header }}</th>
        }
      </tr>
    </thead>
    <tbody hlmTBody>
      @for (row of rows(); track key(row)) {
        <tr hlmTr class="cursor-pointer" [attr.aria-expanded]="isOpen(row)" (click)="toggle(row)">
          <td hlmTd>
            <ng-icon
              class="size-4"
              [name]="isOpen(row) ? 'lucideChevronDown' : 'lucideChevronRight'"
            />
          </td>
          @for (col of columns(); track col.key) {
            <td hlmTd [class]="col.align === 'right' ? 'text-right tabular-nums' : ''">
              @if (cellMap().get(col.key); as tpl) {
                <ng-container *ngTemplateOutlet="tpl; context: { $implicit: row }" />
              } @else {
                {{ cell(row, col) }}
              }
            </td>
          }
        </tr>
        @if (isOpen(row)) {
          <tr hlmTr class="bg-muted/40 hover:bg-muted/40">
            <td hlmTd [attr.colspan]="columns().length + 1" class="p-4">
              <ng-container *ngTemplateOutlet="detail() ?? null; context: { $implicit: row }" />
            </td>
          </tr>
        }
      } @empty {
        <tr hlmTr>
          <td
            hlmTd
            class="h-24 text-center text-muted-foreground"
            [attr.colspan]="columns().length + 1"
          >
            {{ empty() }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
