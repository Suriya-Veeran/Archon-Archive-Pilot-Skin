<div class="grid gap-2">
  @if (label()) {
    <label hlmLabel [for]="id">{{ label() }}</label>
  }
  <input
    hlmInput
    [id]="id"
    [type]="type()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
  @if (error()) {
    <p class="text-sm text-destructive">{{ error() }}</p>
  }
</div>
