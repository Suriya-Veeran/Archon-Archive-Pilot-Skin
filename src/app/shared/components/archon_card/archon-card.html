<section hlmCard>
  @if (title()) {
    <div hlmCardHeader>
      <h3 hlmCardTitle>{{ title() }}</h3>
      @if (description()) {
        <p hlmCardDescription>{{ description() }}</p>
      }
      <div hlmCardAction><ng-content select="[card-actions]" /></div>
    </div>
  }
  <div hlmCardContent><ng-content /></div>
</section>
