<header class="flex h-14 items-center gap-4 border-b px-4">
  <span class="font-semibold"
    >Archon <span class="font-normal text-muted-foreground">Archive Pilot</span></span
  >
  <div class="inline-flex rounded-lg bg-muted p-1">
    @for (p of profiles; track p.id) {
      <button
        type="button"
        class="rounded-md px-3 py-1 text-sm"
        [class]="
          profile.profile() === p.id
            ? 'bg-background font-medium shadow-sm'
            : 'text-muted-foreground'
        "
        (click)="profile.switchTo(p.id)"
      >
        {{ p.label }}
      </button>
    }
  </div>
  <span class="ml-auto text-sm">{{ auth.user()?.name }}</span>
  <button hlmBtn variant="ghost" size="sm" (click)="auth.logout()">Sign out</button>
</header>
