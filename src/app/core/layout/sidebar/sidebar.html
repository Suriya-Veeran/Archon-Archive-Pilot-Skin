<nav class="flex h-full w-60 flex-col gap-1 overflow-y-auto border-r bg-sidebar p-2 text-sm">
  @for (item of profile.nav(); track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-sidebar-accent font-medium"
      class="rounded-md px-3 py-2"
    >
      {{ item.label }}
    </a>
    @for (child of item.children ?? []; track child.path) {
      <a
        [routerLink]="child.path"
        routerLinkActive="font-medium text-foreground"
        class="ml-6 px-2 py-1 text-muted-foreground"
      >
        {{ child.label }}
      </a>
    }
  }
  <div class="mt-auto flex flex-col gap-1 border-t pt-2">
    @for (item of shared; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-sidebar-accent font-medium"
        class="rounded-md px-3 py-2"
      >
        {{ item.label }}
      </a>
    }
  </div>
</nav>
